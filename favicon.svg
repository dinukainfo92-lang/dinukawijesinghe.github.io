<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#090c11"/>
  <!-- Green accent node top-center -->
  <circle cx="32" cy="10" r="5" fill="#2fe28f"/>
  <!-- Blue node bottom-left -->
  <circle cx="12" cy="48" r="4.5" fill="#5ec8ff"/>
  <!-- Blue node bottom-right -->
  <circle cx="52" cy="48" r="4.5" fill="#5ec8ff"/>
  <!-- Lines connecting nodes -->
  <line x1="32" y1="15" x2="12" y2="44" stroke="#2fe28f" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="32" y1="15" x2="52" y2="44" stroke="#2fe28f" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="16" y1="48" x2="48" y2="48" stroke="#5ec8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Center hub -->
  <circle cx="32" cy="33" r="3.5" fill="#2fe28f" opacity="0.6"/>
  <line x1="32" y1="15" x2="32" y2="30" stroke="#2fe28f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
