<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CSV or Excel data flows through a CLI template into generated device configs</title>
<desc>Diagram showing spreadsheet data, a CLI template with variable placeholders, and generated router configuration, connected by arrows, in a dark terminal-style theme.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3a4352" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1200" height="500" fill="#0a0e14"/>

<text x="60" y="56" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#5a6472">$ network-config-generator</text>
<text x="60" y="90" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="26" font-weight="600" fill="#e6ebf0">CSV / Excel → template → config</text>

<g>
  <rect x="70" y="150" width="290" height="270" rx="10" fill="#111722" stroke="#1f2733" stroke-width="1"/>
  <rect x="70" y="150" width="290" height="44" rx="10" fill="#151d2b"/>
  <rect x="70" y="184" width="290" height="10" fill="#151d2b"/>
  <text x="94" y="178" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#7fd4a8">CSV / Excel data</text>
  <text x="94" y="222" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8b94a3">One row per device</text>

  <rect x="94" y="240" width="242" height="150" fill="none" stroke="#2a3341" stroke-width="1"/>
  <line x1="175" y1="240" x2="175" y2="390" stroke="#2a3341" stroke-width="1"/>
  <line x1="256" y1="240" x2="256" y2="390" stroke="#2a3341" stroke-width="1"/>
  <line x1="94" y1="290" x2="336" y2="290" stroke="#2a3341" stroke-width="1"/>
  <line x1="94" y1="340" x2="336" y2="340" stroke="#2a3341" stroke-width="1"/>

  <text x="134" y="270" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7fd4a8" text-anchor="middle">IF</text>
  <text x="215" y="270" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7fd4a8" text-anchor="middle">VLAN</text>
  <text x="296" y="270" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7fd4a8" text-anchor="middle">DESC</text>

  <text x="134" y="315" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">Gi0/1</text>
  <text x="215" y="315" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">20</text>
  <text x="296" y="315" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">Uplink</text>

  <text x="134" y="365" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">Gi0/2</text>
  <text x="215" y="365" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">30</text>
  <text x="296" y="365" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364" text-anchor="middle">Access</text>
</g>

<line x1="368" y1="285" x2="420" y2="285" stroke="#3a4352" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="428" y="150" width="330" height="270" rx="10" fill="#111722" stroke="#1f2733" stroke-width="1"/>
  <rect x="428" y="150" width="330" height="44" rx="10" fill="#151d2b"/>
  <rect x="428" y="184" width="330" height="10" fill="#151d2b"/>
  <text x="452" y="178" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#6fa8f0">Template</text>
  <text x="452" y="222" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8b94a3">Write it once</text>

  <text x="452" y="256" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#c4cbd6">interface <tspan fill="#f0a860">{{IF}}</tspan></text>
  <text x="452" y="286" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#c4cbd6"> switchport access vlan <tspan fill="#f0a860">{{VLAN}}</tspan></text>
  <text x="452" y="316" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#c4cbd6"> description <tspan fill="#f0a860">{{DESC}}</tspan></text>
  <text x="452" y="346" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#c4cbd6"> no shutdown</text>

  <text x="452" y="392" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364">Any vendor CLI syntax works —</text>
  <text x="452" y="408" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4a5364">IOS-XE, IOS-XR, JunOS, NX-OS, EOS</text>
</g>

<line x1="766" y1="285" x2="818" y2="285" stroke="#3a4352" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="826" y="150" width="304" height="270" rx="10" fill="#0d1117" stroke="#1f2733" stroke-width="1"/>
  <rect x="826" y="150" width="304" height="44" rx="10" fill="#151d2b"/>
  <rect x="826" y="184" width="304" height="10" fill="#151d2b"/>
  <circle cx="848" cy="172" r="5" fill="#e5534b"/>
  <circle cx="866" cy="172" r="5" fill="#e5c34b"/>
  <circle cx="884" cy="172" r="5" fill="#4be58e"/>
  <text x="1122" y="178" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8b94a3" text-anchor="end">config.txt</text>

  <text x="850" y="222" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e">interface Gi0/1</text>
  <text x="850" y="242" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> switchport access vlan 20</text>
  <text x="850" y="262" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> description Uplink</text>
  <text x="850" y="282" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> no shutdown</text>
  <text x="850" y="310" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e">interface Gi0/2</text>
  <text x="850" y="330" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> switchport access vlan 30</text>
  <text x="850" y="350" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> description Access</text>
  <text x="850" y="370" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4be58e"> no shutdown</text>
  <text x="850" y="398" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#4a5364">... 10,000+ rows in ms</text>
</g>

<text x="60" y="464" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#4a5364">dinukawijesinghe.com/tools/config-generator.html</text>
<text x="1140" y="464" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#4a5364" text-anchor="end">free · browser-based · no server</text>
</svg>
